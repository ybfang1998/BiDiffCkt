general:
  project_name: 'BiDiffCkt_LaMAGIC'
  model_name: 'BiDiffCkt'
  dataset_name: 'LaMAGIC'
  wandb: 'offline'
  experiment_type: 'sample'
train:
  batch_size: 4096
  lr: 0.0002
  weight_decay: 1e-12
  lambda_train: [1, 1, 5]
  epochs: 300
  edge_output_dim: 2
  edge_loss: 'CE'
  edge_activation: 'softmax'
test:
  n_samples: 100
  batch_size: 50
  num_nodes: "Distributed"
  model_path: 'checkpoints/BiDiffCkt_LaMAGIC.ckpt'
  results_path: 'outputs/BiDiffCkt_LaMAGIC_generated_100_results.pkl'